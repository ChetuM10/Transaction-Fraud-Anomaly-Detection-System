databases:
  - name: fraud-db
    databaseName: fraud_detection
    user: fraud_user
    plan: free

services:
  # ── Backend FastAPI API ──
  - type: web
    name: fraud-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.routes:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fraud-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0

  # ── Frontend React Static Site ──
  - type: web
    name: fraud-dashboard
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://fraud-api-2m10.onrender.com
